on:
  push:
    branches:
      - "**"
  pull_request:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release mode: none = CI only (default), latest = publish the pinned
          spec version, prerelease = publish pinned version + version_postfix,
          post = publish a source-only post release, source = publish checked-in version,
          regenerate = generate, test and commit the pinned SDK on this branch
        required: false
        type: choice
        default: none
        options:
          - none
          - latest
          - prerelease
          - post
          - source
          - regenerate
      version_postfix:
        description: Version suffix, e.g. rc1, dev1 or .post6 (required for prerelease or post)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main

name: CI

env:
  PASSED_VERSION: ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload || fromJSON('{}'))['version'] }}
  VERSION_POSTPEND: ${{ github.event_name == 'workflow_dispatch' && inputs.version_postfix || '' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      REGENERATE: ${{ github.event_name == 'repository_dispatch' || inputs.release == 'latest' || inputs.release == 'prerelease' || inputs.release == 'regenerate' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}

      - uses: vrchatapi/specification/.github/actions/setup-generator@5011d3fddc3db20bed5aedefac53b0ba4640038f
        if: env.REGENERATE == 'true'

      - run: python tools/download_spec.py openapi-3.0.yaml
        if: env.REGENERATE == 'true'

      # PyPI wants `.dev` where the specification says `-nightly.`
      - id: version
        run: |
          if [ "${{ inputs.release }}" = "source" ] && [ -n "${VERSION_POSTPEND}" ]; then
            echo "::error::source releases use the checked-in version without a suffix"
            exit 1
          fi
          if [ "${{ inputs.release }}" = "source" ]; then
            version="$(python tools/check_source_release.py)"
            echo "version=${version}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ inputs.release }}" = "post" ]; then
            version="$(python tools/prepare_post_release.py "${VERSION_POSTPEND}")"
            echo "version=${version}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${REGENERATE}" != "true" ]; then
            version="$(python -c 'import ast; from pathlib import Path; print(next(ast.literal_eval(node.value) for node in ast.parse(Path("vrchatapi/__init__.py").read_text()).body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)))')"
            echo "version=${version}" >> $GITHUB_OUTPUT
            exit 0
          fi
          version=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            version="$(python tools/download_spec.py --version)"
            if [ "${PASSED_VERSION}" != "${version}" ]; then
              echo "::error::Update specification.json before releasing a different specification"
              exit 1
            fi
          elif [ "${{ inputs.release }}" = "prerelease" ]; then
            if [ -z "${VERSION_POSTPEND}" ]; then
              echo "::error::version_postfix is required when release = prerelease"
              exit 1
            fi
            version="$(python tools/download_spec.py --version)${VERSION_POSTPEND}"
          fi
          # Fall back to the checksum-pinned specification version.
          version="${version:-$(python tools/download_spec.py --version)}"
          echo "version=${version/-nightly./.dev}" >> $GITHUB_OUTPUT

      - run: bash ./generate.sh "${{ steps.version.outputs.version }}" openapi-3.0.yaml
        if: env.REGENERATE == 'true'

      - uses: actions/upload-artifact@v7
        with:
          name: python-generated
          # Exclude .git: the publish job downloads this artifact over a fresh
          # checkout, and extracting an artifact that contains .git over the
          # checkout's .git makes download-artifact fail with "download failed
          # after 5 retries".
          path: |
            .
            !.git
          include-hidden-files: true

  test:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-generated

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -r requirements.txt -r test-requirements.txt

      - run: pytest --cov=vrchatapi

  build:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-generated

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install build

      - run: python -m build --sdist --wheel --outdir dist/ .

      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist

  install:
    needs: [build, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: python -m pip install packaging dist/*.whl

      - name: Verify installed artifact version
        env:
          EXPECTED_VERSION: ${{ needs.generate.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version
          import vrchatapi
          expected = Version(os.environ["EXPECTED_VERSION"])
          assert Version(version("vrchatapi-async")) == expected
          assert Version(vrchatapi.__version__) == expected
          PY

  commit_generated:
    needs: [generate, test, build, install]
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'regenerate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The artifact is a complete generated tree. Remove disposable output
      # first so files removed by the new specification are not retained.
      - run: rm -rf vrchatapi docs

      - uses: actions/download-artifact@v8
        with:
          name: python-generated

      - name: Commit verified generation to the selected branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD: ${{ github.sha }}
          SDK_VERSION: ${{ needs.generate.outputs.version }}
        run: |
          if [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Regenerate on a working branch, not the default branch"
            exit 1
          fi
          current=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          if [ "$current" != "$EXPECTED_HEAD" ]; then
            echo "::error::The selected branch changed; refusing to overwrite newer work"
            exit 1
          fi
          git add -A -- vrchatapi docs client/highlevel/_generated_types.py \
            setup.py setup.cfg requirements.txt test-requirements.txt tox.ini \
            .gitlab-ci.yml .openapi-generator .openapi-generator-ignore
          if git diff --cached --quiet; then
            echo "The generated SDK already matches the selected branch"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Regenerate verified SDK $SDK_VERSION"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

  publish:
    needs:
      - generate
      - test
      - build
      - install
    if: >
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.release != 'none' && inputs.release != 'regenerate')
    runs-on: ubuntu-latest
    # This environment supplies PyPI trusted publishing. It is not an approval
    # gate unless Required reviewers are explicitly enabled in GitHub settings.
    # Source releases publish the tested branch without modifying main.
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: python-generated

      - run: rm -f openapi-3.0.yaml

      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        if: inputs.release != 'post' && inputs.release != 'source'
        with:
          branch: main
          folder: .
          commit-message: Release Python SDK ${{ needs.generate.outputs.version }}

      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ inputs.release != 'post' && inputs.release != 'source' }}
